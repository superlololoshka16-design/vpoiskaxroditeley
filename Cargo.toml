[workspace]
resolver = "3"
members = [
    "crates/core-utils",
    "crates/session-state",
    "crates/payload-gen",
    "crates/net-client",
    "crates/parser-pipeline",
    "crates/challenge-solver",
    "crates/runtime-exec",
    "crates/supervisor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[profile.dev]
incremental = false
debug = 0

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.dependencies]
wreq = { version = "6.0.0-rc.20", features = ["stream", "gzip", "brotli", "zstd", "deflate", "hickory-dns", "cookies", "form", "webpki-roots", "charset", "query", "system-proxy"] }
wreq-util = { version = "3.0.0-rc.14", features = ["emulation"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.6", features = ["derive"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
thiserror = "2.0.20"
serde = { version = "1", features = ["derive"] }
scc = "3.8.8"

lol_html = "3.0.1"
sonic-rs = "0.5.8"
simdutf8 = "0.1.5"
aho-corasick = "1.1.5"
memchr = "2.8.3"
base64-turbo = "0.4"

compact_str = { version = "0.10.0", features = ["serde"] }
smallvec = { version = "1.16.0", features = ["write", "const_generics"] }
bytemuck = { version = "1.24", features = ["derive"] }
indexmap = "2.14.1"
twox-hash = "2.1.4"
crossbeam-channel = "0.5.16"
memmap2 = "0.9.11"

encoding_rs = "0.8"
sha2 = "0.11.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
hex = "0.4.3"
phf = { version = "0.14.0", features = ["macros"] }

mimalloc = "0.1.52"
bumpalo = { version = "3", features = ["collections"] }
taffy = "0.9.0"
tiny-skia = "0.11.1"

rquickjs = { version = "0.12.2", features = ["macro"] }

icu_provider_blob = "2.3.0"
icu_provider = { version = "2.3.0", default-features = false, features = ["serde", "sync"] }
icu_provider_adapters = { version = "2.3.0", default-features = false, features = ["serde"] }
icu_locale = { version = "2.3.0", default-features = false, features = ["serde"] }
icu_locale_core = "2.3.0"
icu_locale_fallback = { version = "2.3.0", default-features = false, features = ["serde"] }
icu_datetime = { version = "2.3.0", default-features = false, features = ["serde"] }
icu_decimal = { version = "2.3.0", default-features = false, features = ["serde"] }
icu_plurals = { version = "2.3.0", default-features = false, features = ["serde"] }
icu_segmenter = { version = "2.3.0", default-features = false, features = ["serde", "auto", "lstm"] }
icu_collator = { version = "2.3.0", default-features = false, features = ["serde"] }
icu_list = { version = "2.3.0", default-features = false, features = ["serde"] }
icu_calendar = { version = "2.3.0", default-features = false, features = ["serde"] }
icu_time = { version = "2.3.0", default-features = false }
icu_experimental = { version = "0.6.0", default-features = false, features = ["serde"] }
fixed_decimal = { version = "0.7.2", default-features = false, features = ["ryu"] }
writeable = "0.6.4"
zstd = "0.13"

oxc_allocator = "0.148.0"
oxc_parser = "0.148.0"
oxc_span = "0.148.0"
oxc_ast = "0.148.0"
oxc_traverse = "0.148.0"
oxc_semantic = "0.148.0"
oxc_codegen = "0.148.0"

session-state = { path = "crates/session-state" }
core-utils = { path = "crates/core-utils" }
payload-gen = { path = "crates/payload-gen" }
net-client = { path = "crates/net-client" }
parser-pipeline = { path = "crates/parser-pipeline" }
challenge-solver = { path = "crates/challenge-solver" }
runtime-exec = { path = "crates/runtime-exec" }
