[package]
name = "challenge-solver"
version = "0.4.0"
edition = "2024"
description = "branch-2 challenge math: SHA-NI PoW core, anubis protocol, envelope decoder, slider solver, xxh3 answer cache"

[lib]
name = "challenge_solver"
path = "src/lib.rs"

[dependencies]
parking_lot = "0.12"
core-utils = { workspace = true }
memmap2 = { workspace = true }
smallvec = { workspace = true, features = ["const_generics"] }
compact_str = { workspace = true }
scc = { workspace = true }
crossbeam-channel = { workspace = true }
bumpalo = { workspace = true }

[dev-dependencies]
argon2 = "0.5"
sha2 = { workspace = true }

[[bench]]
name = "pow_bench"
harness = false

[[bench]]
name = "block_bench"
harness = false
